name: DevRadar production off-host backup

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devradar-production-backup
  cancel-in-progress: false

env:
  IMAGE_ROOT: ghcr.io/hphuctv/devradar

jobs:
  backup:
    name: Encrypted PostgreSQL off-host backup
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DEVRADAR_HOST: ${{ vars.DEVRADAR_HOST }}
      DEVRADAR_SSH_USER: ${{ vars.DEVRADAR_SSH_USER }}
      RESTIC_REPOSITORY: ${{ vars.DEVRADAR_RESTIC_REPOSITORY }}
      AWS_DEFAULT_REGION: ${{ vars.DEVRADAR_SPACES_REGION }}
    steps:
      - name: Check out backup contract
        uses: actions/checkout@v7

      - name: Prepare pinned SSH and off-host secret files
        shell: bash
        env:
          DEVRADAR_SSH_PRIVATE_KEY: ${{ secrets.DEVRADAR_SSH_PRIVATE_KEY }}
          DEVRADAR_SSH_KNOWN_HOSTS: ${{ secrets.DEVRADAR_SSH_KNOWN_HOSTS }}
          RESTIC_PASSWORD: ${{ secrets.DEVRADAR_RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DEVRADAR_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEVRADAR_SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          [[ "$DEVRADAR_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "DEVRADAR_HOST is required." >&2; exit 1; }
          [[ "$DEVRADAR_SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "DEVRADAR_SSH_USER is invalid." >&2; exit 1; }
          [[ "$RESTIC_REPOSITORY" =~ ^s3:https://[a-z0-9.-]+/[a-z0-9][a-z0-9.-]{2,62}$ ]] || { echo "RESTIC_REPOSITORY must be an HTTPS S3 bucket URL." >&2; exit 1; }
          [[ -n "$RESTIC_PASSWORD" && -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] || { echo "Off-host backup secrets are incomplete." >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/devradar-backup-ssh"
          install -d -m 0700 "$ssh_dir"
          umask 077
          printf '%s' "$DEVRADAR_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DEVRADAR_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf 'RESTIC_REPOSITORY=%s\nAWS_DEFAULT_REGION=%s\nRESTIC_PASSWORD=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\n' \
            "$RESTIC_REPOSITORY" "$AWS_DEFAULT_REGION" "$RESTIC_PASSWORD" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" \
            > "$RUNNER_TEMP/devradar-offsite.env"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$RUNNER_TEMP/devradar-offsite.env"

      - name: Build and publish patched restic artifact
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username HPhucTV --password-stdin
          tag="$IMAGE_ROOT-restic:0.19.1-$GITHUB_SHA"
          docker build --pull --tag "$tag" deploy/restic
          docker push "$tag" >/dev/null
          digest=$(docker image inspect --format='{{index .RepoDigests 0}}' "$tag")
          [[ "$digest" =~ ^ghcr\.io/hphuctv/devradar-restic@sha256:[0-9a-f]{64}$ ]] || { echo "Restic artifact did not resolve to a digest." >&2; exit 1; }
          echo "RESTIC_IMAGE=$digest" >> "$GITHUB_ENV"
          printf 'RESTIC_IMAGE=%s\n' "$digest" >> "$RUNNER_TEMP/devradar-offsite.env"
          mkdir -p backup-artifacts
          printf 'restic_image=%s\n' "$digest" > backup-artifacts/restic-manifest.txt

      - name: Run encrypted backup and retention on host
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$RUNNER_TEMP/devradar-backup-ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/devradar-backup-ssh/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          target="$DEVRADAR_SSH_USER@$DEVRADAR_HOST"
          ssh "${ssh_args[@]}" "$target" 'mkdir -p /opt/devradar/backup-contract'
          scp "${ssh_args[@]}" compose.yaml compose.production.yaml "$RUNNER_TEMP/devradar-offsite.env" "$target:/opt/devradar/backup-contract/"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_args[@]}" "$target" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          ssh "${ssh_args[@]}" "$target" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/devradar/backup-contract
          archive="/tmp/devradar-$(date -u +%Y%m%d-%H%M%S).dump"
          password_file="/tmp/devradar-restic-password"
          runtime_env="/tmp/devradar-restic-runtime.env"
          cleanup() {
            rm -f "$archive" "$password_file" "$runtime_env" devradar-offsite.env
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          restic_repository=$(awk -F= '$1=="RESTIC_REPOSITORY" {sub(/^[^=]*=/, ""); print; exit}' devradar-offsite.env)
          restic_password=$(awk -F= '$1=="RESTIC_PASSWORD" {sub(/^[^=]*=/, ""); print; exit}' devradar-offsite.env)
          restic_image=$(awk -F= '$1=="RESTIC_IMAGE" {sub(/^[^=]*=/, ""); print; exit}' devradar-offsite.env)
          container_user="$(id -u):$(id -g)"
          [[ "$restic_repository" =~ ^s3:https://[a-z0-9.-]+/[a-z0-9][a-z0-9.-]{2,62}$ ]] || { echo "Remote repository is invalid." >&2; exit 1; }
          [[ -n "$restic_password" ]] || { echo "Remote restic password is missing." >&2; exit 1; }
          [[ "$restic_image" =~ ^ghcr\.io/hphuctv/devradar-restic@sha256:[0-9a-f]{64}$ ]] || { echo "Remote restic image is invalid." >&2; exit 1; }
          [[ "$container_user" =~ ^[1-9][0-9]*:[1-9][0-9]*$ ]] || { echo "Backup host must run as a non-root user." >&2; exit 1; }
          awk -F= '$1=="AWS_ACCESS_KEY_ID" || $1=="AWS_SECRET_ACCESS_KEY" || $1=="AWS_DEFAULT_REGION" {print}' devradar-offsite.env > "$runtime_env"
          printf '%s' "$restic_password" > "$password_file"
          chmod 0600 "$password_file"
          chmod 0600 "$runtime_env"
          compose=(docker compose --env-file /opt/devradar/.env.production -f /opt/devradar/compose.yaml -f /opt/devradar/compose.production.yaml)
          "${compose[@]}" exec -T database sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --format=custom --no-owner --no-privileges' > "$archive"
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --user "$container_user" \
            --env HOME=/tmp --env RESTIC_CACHE_DIR=/tmp/restic-cache \
            --env RESTIC_PASSWORD_FILE=/run/secrets/restic-password \
            --env-file "$runtime_env" \
            --mount "type=bind,source=$password_file,target=/run/secrets/restic-password,readonly" \
            --mount "type=bind,source=$archive,target=/input/database.dump,readonly" \
            "$restic_image" -r "$restic_repository" backup /input/database.dump --tag devradar-postgresql
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --user "$container_user" \
            --env HOME=/tmp --env RESTIC_CACHE_DIR=/tmp/restic-cache \
            --env RESTIC_PASSWORD_FILE=/run/secrets/restic-password \
            --env-file "$runtime_env" \
            --mount "type=bind,source=$password_file,target=/run/secrets/restic-password,readonly" \
            "$restic_image" -r "$restic_repository" forget --keep-daily 7 --keep-weekly 4 --prune
          echo 'offsite_backup=pass retention=7d+4w'
          REMOTE
          mkdir -p backup-artifacts
          printf 'sha=%s\nrun_id=%s\nbackup=pass\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > backup-artifacts/metadata.txt

      - name: Remove temporary backup secrets
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/devradar-backup-ssh/id_ed25519" && -n "${DEVRADAR_HOST:-}" && -n "${DEVRADAR_SSH_USER:-}" ]]; then
            ssh_args=(-i "$RUNNER_TEMP/devradar-backup-ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/devradar-backup-ssh/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
            ssh "${ssh_args[@]}" "$DEVRADAR_SSH_USER@$DEVRADAR_HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -f /opt/devradar/backup-contract/devradar-offsite.env' || true
          fi
          rm -rf "$RUNNER_TEMP/devradar-backup-ssh" "$RUNNER_TEMP/devradar-offsite.env"

      - name: Upload backup metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-offsite-backup-${{ github.run_id }}
          path: backup-artifacts/
          if-no-files-found: ignore
          retention-days: 14
