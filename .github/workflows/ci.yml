name: DevRadar CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  TRIVY_IMAGE: "aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"

jobs:
  python-quality:
    name: Python quality and default tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Pip consistency
        run: python -m pip check
      - name: Default tests
        run: python -m pytest
      - name: Secret scan
        shell: pwsh
        run: ./scripts/scan-secrets.ps1

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: devradar_ci
          POSTGRES_PASSWORD: devradar_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devradar_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: PostgreSQL integration tests
        env:
          DEVRADAR_TEST_DATABASE_URL: postgresql+psycopg://devradar_ci:devradar_ci_only@127.0.0.1:5432/postgres
        run: |
          mkdir -p ci-artifacts
          python -m pytest -m postgresql --junitxml=ci-artifacts/postgresql.xml
      - name: Upload PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgresql-tests-${{ github.run_id }}
          path: ci-artifacts/postgresql.xml
          retention-days: 14

  web-quality:
    name: Web tests, lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install lockfile dependencies
        run: npm ci
      - name: Web check
        run: npm run check
      - name: Dependency audit
        run: npm audit --audit-level=high

  compose-smoke:
    name: Compose migration and API smoke
    runs-on: ubuntu-latest
    needs: [python-quality, postgres-integration, web-quality]
    env:
      DEVRADAR_APP_IMAGE: devradar-app:ci
      DEVRADAR_WEB_IMAGE: devradar-web:ci
      DEVRADAR_INGRESS_IMAGE: devradar-ingress:ci
      DEVRADAR_DOMAIN: http://localhost
      DEVRADAR_HTTP_HOST_PORT: "18080"
      DEVRADAR_HTTPS_HOST_PORT: "18443"
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --pull --tag devradar-app:ci .
      - name: Build web image
        run: docker build --pull --tag devradar-web:ci web
      - name: Build ingress image
        run: docker build --pull --tag devradar-ingress:ci deploy/caddy
      - name: Validate Compose profiles
        run: |
          docker compose --env-file .env.example --profile crawler config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.production.yaml config --quiet
          docker run --rm \
            --env DEVRADAR_DOMAIN=http://localhost \
            --volume "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            devradar-ingress:ci \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start database and migrate
        run: |
          docker compose --env-file .env.example up --detach database --wait
          docker compose --env-file .env.example run --rm api python -m alembic upgrade head
      - name: Start API and run smoke
        run: |
          docker compose --env-file .env.example up --detach api web --wait
          pwsh ./scripts/smoke.ps1 -BaseUrl http://127.0.0.1:8000
          pwsh ./scripts/web-smoke.ps1 -BaseUrl http://127.0.0.1:3000
          docker compose --env-file .env.example -f compose.yaml -f compose.production.yaml up --detach ingress --wait
          curl --fail --silent --show-error http://localhost:18080/api/v1/health
          curl --fail --silent --show-error http://localhost:18080/login >/dev/null
          curl --fail --silent --show-error http://localhost:18080/api/devradar/privacy | grep -q privacy-v1
      - name: Capture Compose smoke artifact
        if: always()
        run: |
          mkdir -p ci-artifacts
          docker compose --env-file .env.example -f compose.yaml -f compose.production.yaml ps > ci-artifacts/compose-ps.txt
          docker compose --env-file .env.example -f compose.yaml -f compose.production.yaml logs > ci-artifacts/compose.log || true
          printf 'sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > ci-artifacts/metadata.txt
      - name: Upload Compose smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-smoke-${{ github.run_id }}
          path: ci-artifacts/
          retention-days: 14
      - name: Teardown without deleting named volume
        if: always()
        run: docker compose --env-file .env.example -f compose.yaml -f compose.production.yaml down

  remote-rollback:
    name: Remote application rollback drill
    runs-on: ubuntu-latest
    needs: compose-smoke
    env:
      DEVRADAR_APP_IMAGE: devradar-app:release
      DEVRADAR_WEB_IMAGE: devradar-web:release
    steps:
      - uses: actions/checkout@v7
      - name: Build release and known-good application images
        run: |
          docker build --pull --tag devradar-app:release .
          docker tag devradar-app:release devradar-app:known-good
          docker build --pull --tag devradar-web:release web
          docker tag devradar-web:release devradar-web:known-good
      - name: Deploy release image and migrate
        run: |
          docker compose --env-file .env.example --project-name devradar-rollback up --detach database --wait
          pwsh ./scripts/migrate.ps1 -EnvironmentFile .env.example -ProjectName devradar-rollback -Action upgrade
          docker compose --env-file .env.example --project-name devradar-rollback up --detach api web --wait
          pwsh ./scripts/smoke.ps1 -BaseUrl http://127.0.0.1:8000
          pwsh ./scripts/web-smoke.ps1 -BaseUrl http://127.0.0.1:3000
      - name: Roll back to known-good image
        run: pwsh ./scripts/rollback.ps1 -EnvironmentFile .env.example -ProjectName devradar-rollback -Image devradar-app:known-good -WebImage devradar-web:known-good -BaseUrl http://127.0.0.1:8000 -WebBaseUrl http://127.0.0.1:3000
      - name: Capture rollback artifact
        if: always()
        run: |
          mkdir -p rollback-artifacts
          docker compose --env-file .env.example --project-name devradar-rollback ps > rollback-artifacts/compose-ps.txt
          docker compose --env-file .env.example --project-name devradar-rollback logs > rollback-artifacts/compose.log || true
          printf 'sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > rollback-artifacts/metadata.txt
      - name: Upload rollback artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-rollback-${{ github.run_id }}
          path: rollback-artifacts/
          retention-days: 14
      - name: Teardown rollback project
        if: always()
        run: docker compose --env-file .env.example --project-name devradar-rollback down

  remote-backup:
    name: Remote PostgreSQL backup and restore drill
    runs-on: ubuntu-latest
    needs: remote-rollback
    steps:
      - uses: actions/checkout@v7
      - name: Build migration application image
        run: docker build --pull --tag devradar-app:local .
      - name: Start isolated PostgreSQL service
        run: docker compose --env-file .env.example --project-name devradar-backup up --detach database --wait
      - name: Run backup and isolated restore
        run: |
          mkdir -p backups backup-artifacts
          pwsh ./scripts/migrate.ps1 -EnvironmentFile .env.example -ProjectName devradar-backup -Action upgrade
          pwsh ./scripts/backup.ps1 -EnvironmentFile .env.example -ProjectName devradar-backup -OutputPath backups/ci.dump
          stat --format='backup_bytes=%s' backups/ci.dump > backup-artifacts/metadata.txt
          pwsh ./scripts/restore.ps1 -EnvironmentFile .env.example -ProjectName devradar-backup -BackupPath backups/ci.dump
          printf 'sha=%s\nrun_id=%s\nrestore=pass\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> backup-artifacts/metadata.txt
      - name: Capture backup drill artifact
        if: always()
        run: |
          docker compose --env-file .env.example --project-name devradar-backup logs database > backup-artifacts/database.log || true
          rm -f backups/ci.dump
      - name: Upload backup drill artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-backup-${{ github.run_id }}
          path: backup-artifacts/
          retention-days: 14
      - name: Teardown backup project
        if: always()
        run: docker compose --env-file .env.example --project-name devradar-backup down

  container-advisory:
    name: Container critical/high advisory gate
    runs-on: ubuntu-latest
    needs: remote-backup
    steps:
      - uses: actions/checkout@v7
      - name: Build image in local store
        run: |
          docker build --pull --tag devradar-app:ci --build-arg DEVRADAR_INSTALL_BROWSER=false .
          docker build --pull --tag devradar-crawler:ci --build-arg DEVRADAR_INSTALL_BROWSER=true .
          docker build --pull --tag devradar-web:ci web
          docker build --pull --tag devradar-ingress:ci deploy/caddy
      - name: Trivy full reports (fixed and unfixed findings)
        run: |
          for image in devradar-app:ci devradar-crawler:ci devradar-web:ci devradar-ingress:ci; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image --quiet --format table --severity HIGH,CRITICAL \
              --ignore-unfixed=false --exit-code 0 "$image"
          done
      - name: Trivy fixable critical/high gate
        run: |
          for image in devradar-app:ci devradar-crawler:ci devradar-web:ci devradar-ingress:ci; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image --quiet --format table --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$image"
          done
