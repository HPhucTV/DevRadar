services:
  api:
    restart: unless-stopped

  web:
    restart: unless-stopped

  database:
    restart: unless-stopped

  ingress:
    image: ${DEVRADAR_INGRESS_IMAGE:-devradar-ingress:local}
    build:
      context: ./deploy/caddy
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DEVRADAR_DOMAIN: ${DEVRADAR_DOMAIN:?DEVRADAR_DOMAIN is required}
    ports:
      - "${DEVRADAR_HTTP_HOST_PORT:-80}:8080"
      - "${DEVRADAR_HTTPS_HOST_PORT:-443}:8443"
      - "${DEVRADAR_HTTPS_HOST_PORT:-443}:8443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
