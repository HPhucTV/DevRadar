name: devradar

x-app-base: &app-base
  image: ${DEVRADAR_APP_IMAGE:-devradar-app:local}
  depends_on:
    database:
      condition: service_healthy
  environment:
    DEVRADAR_DATABASE_URL: >-
      postgresql+psycopg://${POSTGRES_USER:-devradar}:${POSTGRES_PASSWORD:-devradar_local_only}@database:5432/${POSTGRES_DB:-devradar}
    DEVRADAR_OPERATOR_WRITE_ENABLED: ${DEVRADAR_OPERATOR_WRITE_ENABLED:-false}
    DEVRADAR_CV_LOCAL_ENABLED: ${DEVRADAR_CV_LOCAL_ENABLED:-false}
    DEVRADAR_ALERTS_LOCAL_ENABLED: ${DEVRADAR_ALERTS_LOCAL_ENABLED:-false}
    DEVRADAR_CUSTOM_SOURCES_LOCAL_ENABLED: ${DEVRADAR_CUSTOM_SOURCES_LOCAL_ENABLED:-false}
    DEVRADAR_CUSTOM_SOURCE_POLL_SECONDS: ${DEVRADAR_CUSTOM_SOURCE_POLL_SECONDS:-10}
    DEVRADAR_AUTH_ENABLED: ${DEVRADAR_AUTH_ENABLED:-false}
    DEVRADAR_LOCAL_NO_LOGIN_ENABLED: ${DEVRADAR_LOCAL_NO_LOGIN_ENABLED:-false}
    DEVRADAR_OPERATOR_USERNAME: ${DEVRADAR_OPERATOR_USERNAME:-operator}
    DEVRADAR_OPERATOR_PASSWORD_HASH: ${DEVRADAR_OPERATOR_PASSWORD_HASH:-}
    DEVRADAR_AUTH_SESSION_TTL_SECONDS: ${DEVRADAR_AUTH_SESSION_TTL_SECONDS:-86400}
    DEVRADAR_AUTH_COOKIE_SECURE: ${DEVRADAR_AUTH_COOKIE_SECURE:-false}
    DEVRADAR_ALLOWED_ORIGINS: ${DEVRADAR_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
    DEVRADAR_DEPLOYMENT_CLASS: ${DEVRADAR_DEPLOYMENT_CLASS:-LOCALHOST_SERVICE}
    DEVRADAR_SECRET_SOURCE: ${DEVRADAR_SECRET_SOURCE:-environment}
    DEVRADAR_RATE_LIMIT_ENABLED: ${DEVRADAR_RATE_LIMIT_ENABLED:-true}
    DEVRADAR_RATE_LIMIT_GENERAL_MAX: ${DEVRADAR_RATE_LIMIT_GENERAL_MAX:-120}
    DEVRADAR_RATE_LIMIT_GENERAL_WINDOW_SECONDS: ${DEVRADAR_RATE_LIMIT_GENERAL_WINDOW_SECONDS:-60}
    DEVRADAR_RATE_LIMIT_AUTH_MAX: ${DEVRADAR_RATE_LIMIT_AUTH_MAX:-10}
    DEVRADAR_RATE_LIMIT_AUTH_WINDOW_SECONDS: ${DEVRADAR_RATE_LIMIT_AUTH_WINDOW_SECONDS:-900}
    DEVRADAR_RATE_LIMIT_DISPATCH_MAX: ${DEVRADAR_RATE_LIMIT_DISPATCH_MAX:-5}
    DEVRADAR_RATE_LIMIT_DISPATCH_WINDOW_SECONDS: ${DEVRADAR_RATE_LIMIT_DISPATCH_WINDOW_SECONDS:-60}
    DEVRADAR_RATE_LIMIT_MAX_KEYS: ${DEVRADAR_RATE_LIMIT_MAX_KEYS:-10000}
    DEVRADAR_DISCORD_WEBHOOK_URL: ${DEVRADAR_DISCORD_WEBHOOK_URL:-}
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *app-base
    build:
      context: .
      args:
        DEVRADAR_INSTALL_BROWSER: "false"
    ports:
      - "127.0.0.1:${DEVRADAR_API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  web:
    image: ${DEVRADAR_WEB_IMAGE:-devradar-web:local}
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    environment:
      DEVRADAR_API_BASE_URL: "http://api:8000"
      DEVRADAR_LOCAL_NO_LOGIN_ENABLED: ${DEVRADAR_LOCAL_NO_LOGIN_ENABLED:-false}
    ports:
      - "127.0.0.1:${DEVRADAR_WEB_HOST_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/login').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  crawler:
    <<: *app-base
    image: ${DEVRADAR_CRAWLER_IMAGE:-devradar-crawler:local}
    build:
      context: .
      args:
        DEVRADAR_INSTALL_BROWSER: "true"
    profiles:
      - crawler
    init: true
    # Playwright recommends init + host IPC for Chromium containers.
    # Source: https://playwright.dev/python/docs/docker#recommended-docker-configuration
    ipc: host
    cap_add:
      # Required by the Chromium user-namespace sandbox; API still has no capabilities.
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      # Official v1.62.0 Docker default profile with user namespace syscalls.
      # Source: https://playwright.dev/python/docs/docker#crawling-and-scraping
      - seccomp=./playwright-seccomp.json
    entrypoint:
      - python
      - -m
      - devradar.cli
    command:
      - --help

  database:
    image: ${DEVRADAR_DATABASE_IMAGE:-pgvector/pgvector:0.8.6-pg18-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devradar}
      POSTGRES_USER: ${POSTGRES_USER:-devradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devradar_local_only}
    ports:
      - "127.0.0.1:${DEVRADAR_DB_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
